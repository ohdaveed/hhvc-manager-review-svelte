services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # `$env/static/public` is inlined by Vite during `bun run build`, so these
      # two have to arrive as build args. Passing them under `environment:`
      # below would be silently ignored -- the bundle would carry whatever the
      # image was built with. Change one and rebuild: `docker compose up --build`.
      #
      # Compose reads `${...}` from the shell or `./.env` only -- NOT from
      # `.env.local`, which is where `bun run dev` gets them. Secrets come from
      # Doppler, so the shell is the source in practice: `doppler run -- docker
      # compose up --build`, which wins over `./.env` on precedence. An unset
      # variable is a warning, not an error, so the image builds green with an
      # empty Supabase URL inside it. See `.env.example`.
      args:
        SVELTE_PUBLIC_SUPABASE_URL: ${SVELTE_PUBLIC_SUPABASE_URL}
        SVELTE_PUBLIC_SUPABASE_ANON_KEY: ${SVELTE_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      # `$env/dynamic/private`, read by /api/ai/generate per request, so unlike
      # the public pair above these do take effect on a plain restart. Without
      # the key the route calls no model and every AI request answers 501.
      # GEMINI_MODEL is optional -- it defaults to gemini-3.1-flash-lite.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}

    restart: unless-stopped
