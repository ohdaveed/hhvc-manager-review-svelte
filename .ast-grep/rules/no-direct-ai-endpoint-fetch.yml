id: no-direct-ai-endpoint-fetch
language: TypeScript
severity: error
message: Call requestGeneration() instead of fetching /api/ai/generate directly.
note: |
  The endpoint verifies a Supabase bearer token that requestGeneration()
  attaches. A bare fetch sends no Authorization header and gets a 401 --
  at runtime, where nothing in the type system or the test suite catches it.

  src/lib/ai/generate.ts is the sanctioned caller and is excluded below.
files:
  - 'src/**/*.ts'
  - 'src/**/*.js'
ignores:
  - 'src/lib/ai/generate.ts'
rule:
  pattern: fetch('/api/ai/generate', $$$)
