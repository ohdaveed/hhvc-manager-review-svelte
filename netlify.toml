[build]
	# bun, matching the repo's package manager (bun.lock) and the site's own
	# build settings, which said `bun run build` while this file quietly
	# overrode them with npm.
	command = "bun run build"
	publish = "build"

[build.environment]
	# vite@8 requires ^20.19.0 || >=22.12.0; match the local toolchain.
	NODE_VERSION = "24"
