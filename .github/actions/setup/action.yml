name: Set up Bun and install
description: >
  Bun at the version in .bun-version, the Bun install cache, and a
  frozen-lockfile install. Every job in .github/workflows used to repeat these
  steps with the same pinned SHAs, which had to be kept in sync by hand. Run
  actions/checkout first: a local action is read from the checked-out tree.

runs:
  using: composite
  steps:
    # Pinned, not `latest`. `latest` let every run pick up a new Bun with no
    # change in the repo, so a red CI could not be bisected to a commit.
    # Dependabot does not bump .bun-version; raise it deliberately.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile
