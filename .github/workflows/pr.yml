name: PR

# Every pull request, whatever it targets. The repo has run on manual local
# gates until now, so this mirrors `bun run verify` — but as discrete steps
# rather than the script, because verify/ hides output in $TMPDIR and that log
# does not survive the runner.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SVELTE_PUBLIC_* are $env/static/public: inlined at build time, so the build
  # hard-fails without them (src/lib/supabase.ts calls createClient at module
  # scope). These are deliberately placeholders, not secrets — CI is checking
  # that the app builds, not that it can reach Supabase, and placeholders keep
  # the workflow working on fork PRs where secrets are not injected.
  # GEMINI_API_KEY is $env/dynamic/private and is not needed to build.
  SVELTE_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  SVELTE_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  # The blocking gate. Both steps were verified green before this file landed.
  test:
    name: test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Blocking. Unlike prettier/eslint/svelte-check it has no baseline --
      # it reported zero problems when added -- so there is nothing to ratchet
      # down from. It also guards a failure mode nothing else here catches: a
      # broken or renamed workflow silently stops reporting the status checks
      # that ruleset `main: require CI` requires by job name, which removes the
      # gate rather than failing it.
      #
      # Installed from the upstream release with its published checksum: the
      # only actionlint GitHub Action is third-party (51 stars) and the npm
      # package is published by an unaffiliated account, and neither belongs in
      # the job that gates `main`.
      #
      # NOTE: actionlint shells out to shellcheck for `run:` blocks when it is
      # on PATH. The runner has it; a dev machine usually does not, so a clean
      # local `actionlint` is WEAKER than this step and does not prove it will
      # pass. The first version of this step was clean locally and failed here
      # on SC2086. Install shellcheck locally if you want the runs to match.
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSLO "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
          rm -f actionlint "actionlint_${ACTIONLINT_VERSION}_"*

      # Blocking for the same reason actionlint is, and for the reason PLAN.md
      # D1 gives: eslint itself does not block (the tree is not clean), so
      # before this step the error count could grow and nothing failed. This
      # does not make eslint blocking -- the pre-existing errors stay -- it asserts
      # the count cannot rise. It calls eslint directly, never `bun run lint`,
      # whose prettier half is red tree-wide and short-circuits eslint away.
      - name: eslint ratchet
        run: bun run lint:ratchet

      # Same gate for the other baseline. `check` reported without blocking for
      # months, so its documented figure (24) and the measured one (27) drifted
      # apart unnoticed, three of them in app code. Blocking for the same
      # reason the eslint ratchet is: a ratchet that cannot fail the merge is a
      # report.
      - name: svelte-check ratchet
        run: bun run check:ratchet

      # The third baseline, and the one that had no gate at all: `bun run lint`
      # is `prettier --check . && eslint .`, so the prettier half being red
      # tree-wide meant a PR could add newly unformatted files and nothing
      # reported it. This does not make formatting blocking -- the pre-existing
      # drift stays -- it asserts the file count cannot rise. It enumerates
      # `git ls-files` rather than `.`, because `.superpowers/` and
      # `.impeccable/` are untracked but not gitignored, so a tree-wide count
      # depends on which agent tooling has run locally.
      - name: prettier ratchet
        run: bun run format:ratchet

      # Until now this ran only in lefthook's pre-commit, which --no-verify, a
      # non-shell git client and a GitHub web edit all skip -- "Update
      # pr.ymlchznge (#291)" reached `main` that way. The app exists to review
      # copy, so a misspelling in src/lib/data/ ships looking deliberate.
      # local-tool.sh pins the release and checks its SHA-256, the same
      # reasoning as the actionlint step above.
      - name: Spelling (typos)
        run: bash scripts/local-tool.sh typos

      - name: Check corpus lock
        run: bun run corpus:check

      - name: Unit tests
        run: bun run test:unit -- --run

      - name: Production build
        run: bun run build

      # The same scan `bun run verify` runs locally, repeated here because the
      # local one lives in a lefthook pre-commit job -- skippable with
      # --no-verify, absent from a non-shell git client, and absent from a
      # worktree where the hook cannot run. `main` is protected by this job's
      # name, so a gate that is not in this job does not guard the branch.
      #
      # Sourcemaps are included deliberately: code behind `import.meta.env.DEV`
      # is tree-shaken out of the `.js` and survives verbatim in a map's
      # `sourcesContent`, and netlify.toml publishes `build/` wholesale.
      # `grep -l` so a match prints the file, never the secret.
      - name: No server-only values in the published bundle
        run: |
          test -d build || { echo "no build output to scan"; exit 1; }
          if leaked=$(grep -rlE 'GEMINI_API_KEY|AIza[0-9A-Za-z_-]{35}|RAILWAY_API_TOKEN|web-production-9bb3b|arrizon\.david|demo@hhvc\.local|dev-local-only|sb_secret_[A-Za-z0-9_-]{20,}' build/); then
            echo "server-only value(s) in the published bundle:"; echo "$leaked"; exit 1
          fi
          echo "clean"

  # Sharded E2E: splits Playwright tests across 4 parallel runners.
  e2e-shard:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Cache the browser binary across runs and only re-install OS apt deps on a cache hit.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: Install Chromium + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # Calls Playwright directly to skip the redundant `playwright install` inside
      # `bun run test:e2e`. playwright.config.ts webServer builds & previews on :4173.
      - name: Run e2e (shard ${{ matrix.shard }}/4)
        env:
          SHARD: ${{ matrix.shard }}
        run: bunx playwright test --shard="${SHARD}/4"

      # playwright.config.ts writes this folder only because CI now adds the
      # html reporter. Before that every failed shard logged "No files were
      # found with the provided path" and uploaded nothing, traces included.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # Aggregator job so ruleset `main: require CI` still sees a single `e2e` check.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: e2e-shard
    if: always() && !cancelled()
    steps:
      - name: Check e2e shard results
        env:
          SHARD_RESULT: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more e2e shards failed ($SHARD_RESULT)."
            exit 1
          fi
