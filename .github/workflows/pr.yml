name: PR

# Every pull request, whatever it targets. The repo has run on manual local
# gates until now, so this mirrors `bun run verify` — but as discrete steps
# rather than the script, because verify/ hides output in $TMPDIR and that log
# does not survive the runner.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SVELTE_PUBLIC_* are $env/static/public: inlined at build time, so the build
  # hard-fails without them (src/lib/supabase.ts calls createClient at module
  # scope). These are deliberately placeholders, not secrets — CI is checking
  # that the app builds, not that it can reach Supabase, and placeholders keep
  # the workflow working on fork PRs where secrets are not injected.
  # RAILWAY_API_TOKEN is $env/dynamic/private and is not needed to build.
  SVELTE_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  SVELTE_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  # The blocking gate. Both steps were verified green before this file landed.
  test:
    name: test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Blocking, and deliberately inside this job rather than the non-blocking
      # `review` one. Unlike prettier/eslint/svelte-check it has no baseline --
      # it reported zero problems when added -- so there is nothing to ratchet
      # down from. It also guards a failure mode nothing else here catches: a
      # broken or renamed workflow silently stops reporting the status checks
      # that ruleset `main: require CI` requires by job name, which removes the
      # gate rather than failing it.
      #
      # Installed from the upstream release with its published checksum: the
      # only actionlint GitHub Action is third-party (51 stars) and the npm
      # package is published by an unaffiliated account, neither of which
      # belongs in a workflow holding `pull-requests: write`.
      #
      # NOTE: actionlint shells out to shellcheck for `run:` blocks when it is
      # on PATH. The runner has it; a dev machine usually does not, so a clean
      # local `actionlint` is WEAKER than this step and does not prove it will
      # pass. The first version of this step was clean locally and failed here
      # on SC2086. Install shellcheck locally if you want the runs to match.
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -sSLO "${base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLO "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
          rm -f actionlint "actionlint_${ACTIONLINT_VERSION}_"*

      # Blocking for the same reason actionlint is, and for the reason PLAN.md
      # D1 gives: eslint reports in the non-blocking `review` job, so before
      # this step the error count could grow and nothing failed. This does not
      # make eslint blocking -- the five pre-existing errors stay -- it asserts
      # the count cannot rise. It calls eslint directly, never `bun run lint`,
      # whose prettier half is red tree-wide and short-circuits eslint away.
      - name: eslint ratchet
        run: bun run lint:ratchet

      - name: Check corpus lock
        run: bun run corpus:check

      - name: Unit tests
        run: bun run test:unit -- --run

      - name: Production build
        run: bun run build

  # Separate job so a browser download never delays the unit-test signal.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # The test:e2e script runs `playwright install` itself, but without the
      # system libraries Chromium needs on a bare runner.
      - name: Install Chromium + system deps
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts webServer builds and previews on :4173 itself.
      - name: Run e2e
        run: bun run test:e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Static review. NON-BLOCKING ON PURPOSE — see the summary each step writes.
  # Both of these are red on main today, from code this workflow did not touch,
  # so gating on them would make every PR red on day one for reasons unrelated
  # to the PR. They report; they do not block. Fix the baselines, then flip the
  # continue-on-error flags off.
  review:
    name: review (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Formatting (prettier)
        id: prettier
        continue-on-error: true
        run: bunx prettier --check .

      - name: Lint (eslint)
        id: eslint
        continue-on-error: true
        run: bunx eslint .

      # svelte-check carries a documented baseline (24 errors, mostly loose
      # fixture types in test files). Informational only. The old ~55-error
      # baseline was src/legacy_main.js's unresolved imports; that file is gone.
      - name: Types (svelte-check)
        id: svelte_check
        continue-on-error: true
        run: bun run check

      - name: Summary
        if: always()
        run: |
          {
            echo "### Static review"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| prettier | ${{ steps.prettier.outcome }} |"
            echo "| eslint | ${{ steps.eslint.outcome }} |"
            echo "| svelte-check | ${{ steps.svelte_check.outcome }} |"
            echo
            echo "Advisory only — these do not block the PR."
            echo "All three had pre-existing failures on \`main\` when this workflow was added."
          } >> "$GITHUB_STEP_SUMMARY"
