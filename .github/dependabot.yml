version: 2


# Every action in .github/ is pinned to a commit SHA, which is right for supply
# chain but means nothing moves unless something bumps it. Nothing did:
# upload-artifact sat on v4 until runners started warning that its Node 20
# runtime was deprecated. This bumps the SHA and the `# vX` comment together.
#
# The composite action is listed explicitly: Dependabot reads only
# .github/workflows/ from `/`, so .github/actions/setup would otherwise be
# skipped. .bun-version is not covered by any ecosystem and is raised by hand.
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # App dependencies. Security updates already run from repo settings; this adds
  # routine version updates so bun.lock doesn't drift until a CVE forces a jump.
  # Majors stay as separate PRs (they need a real look); minor + patch are
  # grouped into one. The 7-day cooldown skips releases too fresh to have been
  # yanked or flagged -- it does not delay security updates.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
