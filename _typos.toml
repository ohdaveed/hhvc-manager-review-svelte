# typos configuration.
#
# The app exists to review copy, so a misspelling in src/lib/data/*.ts is a
# content defect that ships looking deliberate. This file exists to keep that
# signal trustworthy -- an allowlist entry needs a reason, or the check decays
# into noise everyone skips.

[files]
extend-exclude = [
	# NOTE: `src/css/**` was excluded here as the CSS half of the legacy port.
	# B5 deleted those nine files on 2026-08-28, and the two that remain --
	# `sfds.css` and `theme.css` -- are live, imported by `src/app.css`. Keeping
	# the exclude would have quietly stopped checking them.

	# Generated or vendored.
	"bun.lock",
	".tooling/**",
]

[default.extend-words]
# Subject Matter Expert. Used throughout the editorNote fields to mark content
# that still needs review by someone who knows the domain -- 12 occurrences,
# all deliberate.
SME = "SME"

# Not a word: `fix/remediation-62bfbf5c-ded5f1` is a review-bot branch whose
# suffix is a hash fragment. PLAN.md's H1 table records those names verbatim
# because an identifier written approximately cannot be looked up.
ded = "ded"
